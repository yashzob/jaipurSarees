

{% block content %}
<h1>{{ product.name }}</h1>
<p>Price: {{ product.price }}</p>
<p>Description: {{ product.description }}</p>
{% if product.image %}
<img src="{{ product.image.url }}" alt="{{ product.name }}" width="200">
{% endif %}

<a href="{% url 'product_list' %}" class="btn btn-secondary">Back to List</a>
{% endblock %}
