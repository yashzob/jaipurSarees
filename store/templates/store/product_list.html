

{% block content %}
<h1>Products</h1>
<a href="{% url 'product_create' %}" class="btn btn-primary">Add New Product</a>

<table class="table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td><a href="{% url 'product_detail' product.id %}">{{ product.name }}</a></td>
            <td>{{ product.price }}</td>
            <td>
                <a href="{% url 'product_update' product.id %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'product_delete' product.id %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
